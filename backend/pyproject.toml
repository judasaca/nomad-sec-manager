[project]
name = "nomad-sec-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "nomad-sec-ops",
    "pydantic>=2,<3",
    "pymongo>=4.13,<5",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
nomad-sec-ops = { git = "https://github.com/judasaca/nomad-sec-ops.git", branch = "develop" }

[project.scripts]
nomad-sec-manager-dev = "nomad_sec_manager.main:dev"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
